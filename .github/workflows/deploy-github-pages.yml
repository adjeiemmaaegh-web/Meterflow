name: Build static MeterFlow site for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meterflow-static-site
  cancel-in-progress: true

jobs:
  publish-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Compile production React 19 site
        run: npm run build
      - name: Fix asset paths for the /Meterflow/ address
        run: node scripts/prepare-github-pages.mjs
        env:
          METERFLOW_PAGES_BASE: /Meterflow/
      - name: Verify predictions and IndexedDB tests
        run: npm test
      - name: Verify page links and PWA scope
        run: node tests/pages.test.cjs
      - name: Prepare already-built website files
        run: |
          mkdir -p "$RUNNER_TEMP/meterflow-pages"
          cp -a dist/. "$RUNNER_TEMP/meterflow-pages/"
          touch "$RUNNER_TEMP/meterflow-pages/.nojekyll"
          if find "$RUNNER_TEMP/meterflow-pages" -type f | grep -Ei 'private.*import|\\.xlsx$|\\.xls$'; then
            echo "Refusing to publish private reading files"
            exit 1
          fi
      - name: Save built static website to gh-pages branch
        run: |
          git switch --orphan meterflow-pages-release
          git rm -r -f --ignore-unmatch . || true
          git clean -fdx
          cp -a "$RUNNER_TEMP/meterflow-pages/." .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish ready-to-serve MeterFlow website"
          git push -f origin HEAD:refs/heads/gh-pages
